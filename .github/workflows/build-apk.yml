
name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Revisar Gradle Wrapper
        run: |
          echo "Contenido inicial de gradlew:"
          head -n 5 gradlew
          echo "Tipo de archivo:"
          file gradlew

      - name: Preparar compilación
        run: chmod +x gradlew

      - name: Generar APK
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BoutiqueStyle-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
